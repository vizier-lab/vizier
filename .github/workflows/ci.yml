name: CI

# Per-PR checks (specs/037-core-extraction). Kept small on purpose: none of these builds the
# WebUI. `vizier-http`'s build script embeds whatever it finds in `webui-dist/index.html` when
# `webui/` is not checked out, so a one-line stub is enough to compile and test everything.
# Packaging and the release path are proven by a dry run of `release-and-publish.yml`.

#
# Path-aware (issue #160): a pull request runs the jobs of the crates and feature flags it
# touches, and `gate` is the one required status. `develop`, `master` and release tags run
# everything, including every flag alone.

on:
  pull_request:
  push:
    branches: [master, develop]
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Every rustc warning and clippy's correctness/suspicious lints fail the build. The style,
  # complexity and perf groups stay warnings: the tree carried ~100 of them before CI existed.
  CLIPPY_LINTS: -D warnings -A clippy::style -A clippy::complexity -A clippy::perf

jobs:
  # Maps the changed paths to the jobs that can be affected. A full run (push to develop/master,
  # a release tag) and a change to a shared file turn everything on.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      core: ${{ steps.plan.outputs.core }}
      flags: ${{ steps.plan.outputs.flags }}
      roles: ${{ steps.plan.outputs.roles }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - 'crates/vizier-derive/**'
              - 'crates/vizier-schema/**'
              - '.github/workflows/ci.yml'
            core:
              - 'crates/vizier-core/**'
            http:
              - 'crates/vizier-http/**'
            bin:
              - 'crates/vizier/**'
              - 'dummyplug'
            fleet:
              - 'crates/vizier-fleet/**'
            # The files that decide every role's build: a change to the binary, the engine or
            # the role table (lib.rs) turns every role job on.
            role-shared:
              - 'crates/vizier/**'
              - 'crates/vizier-core/**'
              - 'crates/vizier-fleet/src/lib.rs'
              - 'crates/vizier-fleet/Cargo.toml'
            role-gateway-http:
              - 'crates/vizier-fleet/src/gateway_http.rs'
              - 'crates/vizier-http/**'
            role-gateway-grpc:
              - 'crates/vizier-fleet/src/gateway_grpc.rs'
            role-worker:
              - 'crates/vizier-fleet/src/worker.rs'
              - 'crates/vizier-core/src/agents/**'
            role-channels:
              - 'crates/vizier-fleet/src/channels.rs'
              - 'crates/vizier-core/src/channels/**'
            role-control:
              - 'crates/vizier-fleet/src/control.rs'
              - 'crates/vizier-core/src/scheduler/**'
            channel-discord:
              - 'crates/vizier-core/src/channels/**'
              - 'crates/vizier-core/src/integrations/**'
              - 'crates/vizier-core/src/agents/tools/**'
              - 'crates/vizier-core/src/utils/**'
            channel-telegram:
              - 'crates/vizier-core/src/channels/**'
              - 'crates/vizier-core/src/integrations/**'
              - 'crates/vizier-core/src/agents/tools/**'
              - 'crates/vizier-core/src/utils/**'
            provider-media:
              - 'crates/vizier-core/src/stt/**'
              - 'crates/vizier-core/src/tts/**'
              - 'crates/vizier-core/src/llm/media/**'
            addon-docker:
              - 'crates/vizier-core/src/agents/shell/**'
            addon-documents:
              - 'crates/vizier-core/src/agents/tools/**'
              - 'crates/vizier-core/src/integrations/**'
              - 'crates/vizier-core/src/dependencies.rs'
              - 'crates/vizier-core/src/agents/mod.rs'
            telemetry:
              - 'crates/vizier-core/src/telemetry.rs'
              - 'crates/vizier-core/src/llm/telemetry.rs'
            utoipa:
              - 'crates/vizier-core/src/schema/**'
              - 'crates/vizier-core/src/service/**'
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHARED: ${{ steps.filter.outputs.shared }}
          CORE: ${{ steps.filter.outputs.core }}
          HTTP: ${{ steps.filter.outputs.http }}
          BIN: ${{ steps.filter.outputs.bin }}
          FLEET: ${{ steps.filter.outputs.fleet }}
          ROLE_SHARED: ${{ steps.filter.outputs.role-shared }}
          ROLE_role_gateway_http: ${{ steps.filter.outputs.role-gateway-http }}
          ROLE_role_gateway_grpc: ${{ steps.filter.outputs.role-gateway-grpc }}
          ROLE_role_worker: ${{ steps.filter.outputs.role-worker }}
          ROLE_role_channels: ${{ steps.filter.outputs.role-channels }}
          ROLE_role_control: ${{ steps.filter.outputs.role-control }}
          FLAG_channel_discord: ${{ steps.filter.outputs.channel-discord }}
          FLAG_channel_telegram: ${{ steps.filter.outputs.channel-telegram }}
          FLAG_provider_media: ${{ steps.filter.outputs.provider-media }}
          FLAG_addon_docker: ${{ steps.filter.outputs.addon-docker }}
          FLAG_addon_documents: ${{ steps.filter.outputs.addon-documents }}
          FLAG_telemetry: ${{ steps.filter.outputs.telemetry }}
          FLAG_utoipa: ${{ steps.filter.outputs.utoipa }}
        run: |
          set -euo pipefail
          full=false
          if [ "$EVENT" = push ] && { [ "$REF" = refs/heads/develop ] || [ "$REF" = refs/heads/master ] || [[ "$REF" == refs/tags/* ]]; }; then
            full=true
          fi
          if [ "$SHARED" = true ]; then full=true; fi
          rust=false
          if [ "$full" = true ] || [ "$CORE" = true ] || [ "$HTTP" = true ] || [ "$BIN" = true ] || [ "$FLEET" = true ]; then rust=true; fi
          core=false
          if [ "$full" = true ] || [ "$CORE" = true ]; then core=true; fi
          # One matrix entry per flag, each built and tested alone. Keep in step with the
          # [features] table of crates/vizier-core/Cargo.toml (the policy job checks `full`).
          flags=()
          for name in channel-discord channel-telegram provider-media addon-docker addon-documents telemetry utoipa; do
            var="FLAG_${name//-/_}"
            if [ "$full" = true ] || [ "${!var}" = true ]; then flags+=("\"$name\""); fi
          done
          list=$(IFS=,; echo "${flags[*]:-}")
          # One matrix entry per role the binary can carry (#161), each built alone. Keep in
          # step with the [features] table of crates/vizier/Cargo.toml (the policy job checks
          # that `role-all` lists exactly these).
          roles=()
          for name in role-gateway-http role-gateway-grpc role-worker role-channels role-control; do
            var="ROLE_${name//-/_}"
            if [ "$full" = true ] || [ "$ROLE_SHARED" = true ] || [ "${!var}" = true ]; then roles+=("\"$name\""); fi
          done
          rlist=$(IFS=,; echo "${roles[*]:-}")
          {
            echo "rust=$rust"
            echo "core=$core"
            echo "flags=[${list}]"
            echo "roles=[${rlist}]"
          } >> "$GITHUB_OUTPUT"

  rust:
    name: rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The dummyplug harness starts the Node server from this one submodule.
      - run: git submodule update --init dummyplug
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev python3-dev libclang-dev clang perl make
      - name: Stub the WebUI
        run: |
          mkdir -p crates/vizier-http/webui-dist
          echo '<!doctype html><title>vizier</title>' > crates/vizier-http/webui-dist/index.html
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- $CLIPPY_LINTS
      - name: Test
        env:
          CI: 'true'
        run: cargo test --workspace

  # The engine alone: no optional feature, no web or CLI crate.
  core-minimal:
    name: core-minimal
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init dummyplug
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: core-minimal
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev python3-dev libclang-dev clang perl make
      - name: Test
        env:
          CI: 'true'
        run: cargo test -p vizier-core --no-default-features

  # Every optional flag of the engine on its own, so a flag that only compiles next to another
  # one is caught. Only the flags a change touches run; a full run runs them all.
  flag:
    name: flag (${{ matrix.flag }})
    needs: changes
    if: needs.changes.outputs.flags != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flag: ${{ fromJSON(needs.changes.outputs.flags) }}
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init dummyplug
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: flag-${{ matrix.flag }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev python3-dev libclang-dev clang perl make
      - name: Clippy
        run: cargo clippy -p vizier-core --no-default-features --features ${{ matrix.flag }} --all-targets -- $CLIPPY_LINTS
      - name: Test
        env:
          CI: 'true'
        run: cargo test -p vizier-core --no-default-features --features ${{ matrix.flag }}

  # Every role the binary can carry, built and tested alone (#161): a role that only compiles
  # next to another one is caught here, and a build must refuse a role it does not carry.
  role:
    name: role (${{ matrix.role }})
    needs: changes
    if: needs.changes.outputs.roles != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJSON(needs.changes.outputs.roles) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: role-${{ matrix.role }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev python3-dev libclang-dev clang perl make
      - name: Stub the WebUI
        run: |
          mkdir -p crates/vizier-http/webui-dist
          echo '<!doctype html><title>vizier</title>' > crates/vizier-http/webui-dist/index.html
      - name: Clippy
        run: cargo clippy -p vizier --no-default-features --features ${{ matrix.role }} --all-targets -- $CLIPPY_LINTS
      - name: Test
        env:
          CI: 'true'
        run: cargo test -p vizier --no-default-features --features ${{ matrix.role }}

  # The managed deployment backends: every parametrised storage test runs again against an
  # isolated PostgreSQL schema, and the blob conformance test runs against a real MinIO bucket.
  managed-storage:
    name: managed storage
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vizier-test
          POSTGRES_DB: vizier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vizier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init dummyplug
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: managed-storage
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev python3-dev libclang-dev clang perl make postgresql-client
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Build and start MinIO
        env:
          MINIO_ROOT_USER: vizier
          MINIO_ROOT_PASSWORD: vizier-test-secret
        run: |
          # MinIO Community Edition no longer publishes public container images. Build the
          # last release used by this suite from its immutable upstream source revision.
          go install github.com/minio/minio@v0.0.0-20250422221226-0d7408fc9969
          mkdir -p /tmp/vizier-minio
          nohup "$HOME/go/bin/minio" server /tmp/vizier-minio >/tmp/vizier-minio.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vizier-minio.log
          exit 1
      - name: Prepare PostgreSQL
        env:
          PGPASSWORD: vizier-test
        run: psql -h 127.0.0.1 -U postgres -d vizier -c 'CREATE EXTENSION vector'
      - name: Test managed backends
        env:
          CI: 'true'
          VIZIER_TEST_DATABASE_URL: postgres://postgres:vizier-test@127.0.0.1:5432/vizier
          VIZIER_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          VIZIER_TEST_S3_ACCESS_KEY_ID: vizier
          VIZIER_TEST_S3_SECRET_ACCESS_KEY: vizier-test-secret
        run: cargo test -p vizier-core --lib

  # Reads `cargo metadata` only: no compile.
  policy:
    name: policy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Layering
        # The engine must not declare the web framework, the CLI or the terminal UI, and the
        # HTTP adapter must not declare the CLI. Direct dependencies only: a third-party crate
        # may legitimately pull axum or tower-http in transitively (bollard via tonic).
        run: |
          set -euo pipefail
          direct() {
            cargo metadata --format-version 1 --locked \
              | jq -r --arg c "$1" '.packages[] | select(.name==$c) | .dependencies[] | select(.kind==null) | .name'
          }
          fail=0
          check() {
            crate="$1"; shift
            for banned in "$@"; do
              if direct "$crate" | grep -qx "$banned"; then
                echo "::error::$crate depends on $banned, which belongs to a layer above it"
                fail=1
              fi
            done
          }
          # argon2 is allowed in the engine: password hashing is part of the service layer (spec 038),
          # shared by the server and the desktop app. JWT issuing stays in the HTTP adapter.
          # Fleet (#161): the engine gets the bus traits from vizier-schema and never a bus or
          # gRPC implementation; the roles are built from core's seams and nothing above them.
          check vizier-core axum axum-extra tower-http utoipa-axum utoipa-swagger-ui clap inquire termimad daemonize dotenvy opentelemetry-otlp jsonwebtoken tracing-subscriber async-nats tonic
          check vizier-http clap inquire termimad daemonize dotenvy opentelemetry-otlp
          check vizier-fleet clap inquire termimad daemonize dotenvy async-nats tonic
          exit $fail
      - name: Optional dependencies stay behind their flag
        # Every optional dependency of vizier-core must be absent from the feature-less build,
        # and every flag must be listed in `full`, so none is orphaned.
        run: |
          set -euo pipefail
          meta=$(cargo metadata --format-version 1 --locked --no-deps)
          optional=$(echo "$meta" | jq -r '.packages[] | select(.name=="vizier-core") | .dependencies[] | select(.optional) | .name' | sort -u)
          bare=$(cargo tree -p vizier-core --no-default-features -e normal --depth 1 --prefix none | awk '{print $1}' | sort -u)
          fail=0
          for dep in $optional; do
            if echo "$bare" | grep -qx "$dep"; then
              echo "::error::vizier-core pulls the optional dependency $dep without its flag"
              fail=1
            fi
          done
          orphans=$(echo "$meta" | jq -r '.packages[] | select(.name=="vizier-core") | .features | (.full // []) as $full | keys[] | select(. != "default" and . != "full") | select(. as $k | $full | index($k) | not)')
          for orphan in $orphans; do
            echo "::error::feature $orphan is missing from full"
            fail=1
          done
          exit $fail
      - name: Roles stay independent
        # One role's code may not reach into another's (#161, #159): each is built from the bus
        # traits, the storage traits and its own config, so a role stays testable alone. Only a
        # module *path* counts; a doc comment may name a peer freely.
        run: |
          set -euo pipefail
          cd crates/vizier-fleet/src
          fail=0
          for file in *.rs; do
            module="${file%.rs}"
            [ "$module" = lib ] && continue
            others=$(ls *.rs | sed 's/\.rs$//' | grep -vx -e "$module" -e lib | paste -sd'|')
            if grep -nE "(crate|super)::(${others})\b" "$file"; then
              echo "::error::crates/vizier-fleet/src/$file reaches into another role"
              fail=1
            fi
          done
          exit $fail
      - name: Role flags are declared consistently
        # `role-all` must list exactly the binary's `role-*` flags: a build that asks for every
        # role must not silently leave one out (#161).
        run: |
          set -euo pipefail
          meta=$(cargo metadata --format-version 1 --locked --no-deps)
          roles=$(echo "$meta" | jq -r '.packages[] | select(.name=="vizier") | .features | keys[] | select(startswith("role-") and . != "role-all")' | sort)
          all=$(echo "$meta" | jq -r '.packages[] | select(.name=="vizier") | .features["role-all"][]' | sort)
          if [ "$roles" != "$all" ]; then
            echo "::error::role-all does not list exactly the role-* flags of the binary"
            diff <(echo "$roles") <(echo "$all") || true
            exit 1
          fi
      - name: Dependencies unchanged
        # Existing version/source pairs must not change. New crate names are review notices;
        # additive versions of existing names require an exact allow-list entry below.
        run: |
          set -euo pipefail
          triples() {
            cargo metadata --format-version 1 --locked --manifest-path "$1/Cargo.toml" \
              | jq -r '.packages[] | "\(.name) \(.version) \(.source)"' \
              | grep -vE '^vizier(-core|-fleet|-http|-derive)? ' | sort -u
          }
          git worktree add ../master origin/master
          triples ../master > /tmp/master.txt
          triples . > /tmp/head.txt
          python3 -I - /tmp/master.txt /tmp/head.txt <<'PY'
          import sys
          from collections import defaultdict

          def load(path):
              out = defaultdict(set)
              for line in open(path):
                  name, rest = line.rstrip("\n").split(" ", 1)
                  out[name].add(rest)
              return out

          # Reviewed transitive resolutions required by the rust-postgres stack. Baseline
          # versions must remain present; only these exact additional pairs are accepted.
          allowed_additions = {
              "const-oid": {"0.9.6 registry+https://github.com/rust-lang/crates.io-index"},
              "fallible-iterator": {"0.2.0 registry+https://github.com/rust-lang/crates.io-index"},
              "md-5": {"0.11.0 registry+https://github.com/rust-lang/crates.io-index"},
              "wasi": {"0.14.7+wasi-0.2.4 registry+https://github.com/rust-lang/crates.io-index"},
          }

          base, head = load(sys.argv[1]), load(sys.argv[2])
          only = sorted(set(base) ^ set(head))
          if only:
              print("::notice::crates present on one side only (review):")
              for name in only:
                  print(f"  {name}: master={sorted(base.get(name, []))} head={sorted(head.get(name, []))}")

          violations = {}
          for name in sorted(set(base) & set(head)):
              removed = base[name] - head[name]
              added = head[name] - base[name]
              unexpected = added - allowed_additions.get(name, set())
              if removed or unexpected:
                  violations[name] = (removed, unexpected)
              elif added:
                  print(f"::notice::reviewed additive resolution for {name}: {sorted(added)}")

          if violations:
              print("::error::resolved dependency versions or sources changed:")
              for name, (removed, unexpected) in violations.items():
                  print(f"  {name}: removed={sorted(removed)} unexpected={sorted(unexpected)}")
              sys.exit(1)
          print("no existing dependency version or source changed")
          PY

      - name: Native dependencies match the app
        # FR-023: the desktop app has its own lockfile (app/Cargo.lock); the crates that carry
        # native code must resolve to the same versions in both, or the app ships something
        # the server never tested.
        run: |
          set -euo pipefail
          ver() {
            python3 -I - "$1" <<'PY'
          import sys, tomllib
          want = {"fastembed", "ort", "ort-sys", "whisper-rs", "any-tts"}
          with open(sys.argv[1], "rb") as f:
              lock = tomllib.load(f)
          for p in sorted(lock["package"], key=lambda p: (p["name"], p["version"])):
              if p["name"] in want:
                  print(p["name"], p["version"])
          PY
          }
          ver Cargo.lock > /tmp/server-native.txt
          ver app/Cargo.lock > /tmp/app-native.txt
          diff -u /tmp/server-native.txt /tmp/app-native.txt || { echo "::error::native dependency versions differ between Cargo.lock and app/Cargo.lock"; exit 1; }

  # The desktop app (specs/038-desktop-app-edition). Builds the WebUI because the app embeds it.
  # Only runs when something the app is built from changes; server-only PRs skip it.
  app:
    name: app (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - name: Allow long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            app:
              - 'app/**'
              - 'crates/**'
              - 'webui'
              - 'design'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.app == 'true'
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.app == 'true'
        with:
          workspaces: app -> target
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.app == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            design/package-lock.json
            webui/package-lock.json
      - name: Point bindgen at LLVM
        if: steps.changes.outputs.app == 'true' && runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      - name: Install Linux dependencies
        if: steps.changes.outputs.app == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            pkg-config libssl-dev python3-dev libclang-dev clang perl make
      - name: Build the WebUI
        if: steps.changes.outputs.app == 'true'
        shell: bash
        run: |
          (cd design && npm ci)
          cd webui
          npm ci
          npm run build
      - name: Clippy and test
        if: steps.changes.outputs.app == 'true'
        working-directory: app
        shell: bash
        env:
          CI: 'true'
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

  # The one required status. Jobs a change cannot affect are skipped, and a skipped job passes;
  # a failed or cancelled one fails the gate. Branch protection requires only this job.
  gate:
    name: gate
    if: always()
    needs: [changes, rust, core-minimal, flag, role, managed-storage, policy, app]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            echo "::error::a required job failed"
            exit 1
          fi
