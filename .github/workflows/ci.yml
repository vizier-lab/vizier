name: CI

# Per-PR checks (specs/037-core-extraction). Kept small on purpose: none of these builds the
# WebUI. `vizier-http`'s build script embeds whatever it finds in `webui-dist/index.html` when
# `webui/` is not checked out, so a one-line stub is enough to compile and test everything.
# Packaging and the release path are proven by a dry run of `release-and-publish.yml`.

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Every rustc warning and clippy's correctness/suspicious lints fail the build. The style,
  # complexity and perf groups stay warnings: the tree carried ~100 of them before CI existed.
  CLIPPY_LINTS: -D warnings -A clippy::style -A clippy::complexity -A clippy::perf

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The dummyplug harness starts the Node server from this one submodule.
      - run: git submodule update --init dummyplug
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev python3-dev libclang-dev clang perl make
      - name: Stub the WebUI
        run: |
          mkdir -p crates/vizier-http/webui-dist
          echo '<!doctype html><title>vizier</title>' > crates/vizier-http/webui-dist/index.html
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- $CLIPPY_LINTS
      - name: Test
        env:
          CI: 'true'
        run: cargo test --workspace

  # The engine alone: no optional feature, no web or CLI crate.
  core-minimal:
    name: core-minimal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init dummyplug
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: core-minimal
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev python3-dev libclang-dev clang perl make
      - name: Test
        env:
          CI: 'true'
        run: cargo test -p vizier-core --no-default-features

  # The managed deployment backends: every parametrised storage test runs again against an
  # isolated PostgreSQL schema, and the blob conformance test runs against a real MinIO bucket.
  managed-storage:
    name: managed storage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vizier-test
          POSTGRES_DB: vizier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vizier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init dummyplug
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: managed-storage
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev python3-dev libclang-dev clang perl make postgresql-client
      - name: Start MinIO
        run: |
          docker run --detach --rm --name vizier-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=vizier \
            --env MINIO_ROOT_PASSWORD=vizier-test-secret \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:9000/minio/health/ready && exit 0
            sleep 1
          done
          docker logs vizier-minio
          exit 1
      - name: Prepare PostgreSQL
        env:
          PGPASSWORD: vizier-test
        run: psql -h 127.0.0.1 -U postgres -d vizier -c 'CREATE EXTENSION vector'
      - name: Test managed backends
        env:
          CI: 'true'
          VIZIER_TEST_DATABASE_URL: postgres://postgres:vizier-test@127.0.0.1:5432/vizier
          VIZIER_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          VIZIER_TEST_S3_ACCESS_KEY_ID: vizier
          VIZIER_TEST_S3_SECRET_ACCESS_KEY: vizier-test-secret
        run: cargo test -p vizier-core --lib

  # Reads `cargo metadata` only: no compile.
  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Layering
        # The engine must not declare the web framework, the CLI or the terminal UI, and the
        # HTTP adapter must not declare the CLI. Direct dependencies only: a third-party crate
        # may legitimately pull axum or tower-http in transitively (bollard via tonic).
        run: |
          set -euo pipefail
          direct() {
            cargo metadata --format-version 1 --locked \
              | jq -r --arg c "$1" '.packages[] | select(.name==$c) | .dependencies[] | select(.kind==null) | .name'
          }
          fail=0
          check() {
            crate="$1"; shift
            for banned in "$@"; do
              if direct "$crate" | grep -qx "$banned"; then
                echo "::error::$crate depends on $banned, which belongs to a layer above it"
                fail=1
              fi
            done
          }
          # argon2 is allowed in the engine: password hashing is part of the service layer (spec 038),
          # shared by the server and the desktop app. JWT issuing stays in the HTTP adapter.
          check vizier-core axum axum-extra tower-http utoipa-axum utoipa-swagger-ui clap inquire termimad daemonize dotenvy opentelemetry-otlp jsonwebtoken tracing-subscriber
          check vizier-http clap inquire termimad daemonize dotenvy opentelemetry-otlp
          exit $fail
      - name: Dependencies unchanged
        # FR-019: no dependency version or source may change. The workspace's own crates are
        # left out; an entry on one side only (a feature made optional) is printed, not failed.
        run: |
          set -euo pipefail
          triples() {
            cargo metadata --format-version 1 --locked --manifest-path "$1/Cargo.toml" \
              | jq -r '.packages[] | "\(.name) \(.version) \(.source)"' \
              | grep -vE '^vizier(-core|-http|-derive)? ' | sort -u
          }
          git worktree add ../master origin/master
          triples ../master > /tmp/master.txt
          triples . > /tmp/head.txt
          # A crate name on both sides whose set of (version, source) differs fails; a crate
          # locked at several versions is compared as a set, not line by line.
          python3 -I - /tmp/master.txt /tmp/head.txt <<'PY'
          import sys
          from collections import defaultdict
          def load(path):
              out = defaultdict(set)
              for line in open(path):
                  name, rest = line.rstrip("\n").split(" ", 1)
                  out[name].add(rest)
              return out
          base, head = load(sys.argv[1]), load(sys.argv[2])
          only = sorted(set(base) ^ set(head))
          if only:
              print("::notice::crates present on one side only (review):")
              for n in only:
                  print(f"  {n}: master={sorted(base.get(n, []))} head={sorted(head.get(n, []))}")
          changed = [n for n in sorted(set(base) & set(head)) if base[n] != head[n]]
          if changed:
              print("::error::resolved dependency versions or sources changed:")
              for n in changed:
                  print(f"  {n}: master={sorted(base[n])} head={sorted(head[n])}")
              sys.exit(1)
          print("no dependency version changes")
          PY

      - name: Native dependencies match the app
        # FR-023: the desktop app has its own lockfile (app/Cargo.lock); the crates that carry
        # native code must resolve to the same versions in both, or the app ships something
        # the server never tested.
        run: |
          set -euo pipefail
          ver() {
            python3 -I - "$1" <<'PY'
          import sys, tomllib
          want = {"fastembed", "ort", "ort-sys", "whisper-rs", "any-tts"}
          with open(sys.argv[1], "rb") as f:
              lock = tomllib.load(f)
          for p in sorted(lock["package"], key=lambda p: (p["name"], p["version"])):
              if p["name"] in want:
                  print(p["name"], p["version"])
          PY
          }
          ver Cargo.lock > /tmp/server-native.txt
          ver app/Cargo.lock > /tmp/app-native.txt
          diff -u /tmp/server-native.txt /tmp/app-native.txt || { echo "::error::native dependency versions differ between Cargo.lock and app/Cargo.lock"; exit 1; }

  # The desktop app (specs/038-desktop-app-edition). Builds the WebUI because the app embeds it.
  # Only runs when something the app is built from changes; server-only PRs skip it.
  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - name: Allow long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            app:
              - 'app/**'
              - 'crates/**'
              - 'webui'
              - 'design'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.app == 'true'
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.app == 'true'
        with:
          workspaces: app -> target
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.app == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            design/package-lock.json
            webui/package-lock.json
      - name: Point bindgen at LLVM
        if: steps.changes.outputs.app == 'true' && runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      - name: Install Linux dependencies
        if: steps.changes.outputs.app == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            pkg-config libssl-dev python3-dev libclang-dev clang perl make
      - name: Build the WebUI
        if: steps.changes.outputs.app == 'true'
        shell: bash
        run: |
          (cd design && npm ci)
          cd webui
          npm ci
          npm run build
      - name: Clippy and test
        if: steps.changes.outputs.app == 'true'
        working-directory: app
        shell: bash
        env:
          CI: 'true'
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
