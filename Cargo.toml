[workspace]
members = ["crates/*"]
default-members = ["crates/vizier"]
resolver = "3"

[workspace.package]
version = "0.14.0-rc.1"
edition = "2024"
authors = ["Ganesha Danu <hi@blinfoldking.dev>"]
license = "MIT"
repository = "https://github.com/vizier-lab/vizier"

[workspace.dependencies]
chrono = { version = "0.4.43", features = ["serde"] }
axum = { version = "0.8.8", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["multipart"] }
anyhow = "1.0.100"
arc-swap = "1.7"
clap = { version = "4.5.57", features = ["derive"] }
config = "0.15.19"
dirs = "7.0.0"
flume = "0.12.0"
form_urlencoded = "1.2.2"
futures = "0.3.31"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["json", "multipart", "query"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_urlencoded = "0.7.1"
serde_yaml = "0.9.34"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
twilight-gateway = { version = "0.17.1", default-features = false, features = ["rustls-platform-verifier", "twilight-http", "zstd"] }
twilight-http = { version = "0.17.1", default-features = false, features = ["rustls-platform-verifier", "decompression"] }
twilight-model = { version = "0.17.1" }
twilight-util = { version = "0.17.0", features = ["builder", "snowflake"] }
teloxide = { version = "0.17" }
slugify = "0.1.0"
strum = "0.28.0"
text-splitter = { version = "0.33.0", features = ["markdown"] }
tokio = { version = "1.49.0", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "net",
  "sync",
  "process",
] }
uuid = { version = "1.21.0", features = ["serde", "v4"] }
duration-string = { version = "0.5.3", features = ["serde"] }
inquire = { version = "0.9.3", features = ["chrono"] }
tokio-tungstenite = "0.30.0"
tungstenite = "0.30.0"
nanoid = "0.5.0"
parking_lot = "0.12"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
argon2 = "0.6"
base64 = "0.23"
sha2 = "0.11"
ring = "0.17"
zeroize = "1.9"
tower-http = { version = "0.7.1", features = ["cors", "fs", "limit", "normalize-path"] }
rust-embed = "8.11.0"
flate2 = "1.1.10"
mime_guess = "2.0.5"
rusqlite = { version = "0.40", features = ["bundled"] }
sqlite-vec = "0.1.9"
# Pinned (#73): newer fastembed pulls ort rc.13, which has no x86_64-apple-darwin
# binaries. Keep the pin until that target is available.
fastembed = "=4.9.1"
croner = { version = "4.0.1", features = ["serde"] }
indicatif = { version = "0.18.6" }
rand = "0.10.0"
dotenvy = "0.15.7"
async-trait = "0.1.89"
termimad = "0.35.5"
utoipa = { version = "6", features = ["chrono"] }
utoipa-axum = "0.3"
utoipa-swagger-ui = { version = "10", features = ["axum"] }
glob = "0.3.3"
tar = "0.4"
bzip2 = "0.6"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
shellexpand = "3.1.2"
bollard = { version = "0.21.1", features = ["buildkit", "chrono"] }
rmcp = { version = "3.5.1", features = [
  "client",
  "macros",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
  "transport-streamable-http-server",
] }
html2md = "0.2.15"
daemonize = "0.5.0"
tempfile = "3"
pdf-extract = { version = "0.12" }
docx-rs = { version = "0.4" }
calamine = { version = "0.36" }
rust_xlsxwriter = { version = "0.101.0" }
# Calculates formulas for office_xlsx_read_as_csv(executed_formula=true); used only in
# src/agents/tools/office/formula.rs. Chosen by the trial in specs/036-office-addon/research.md R10.
ironcalc = { version = "0.9" }
pulldown-cmark = "0.13"
hound = { version = "3.5" }
symphonia = { version = "0.6.1", features = ["mp3", "ogg", "vorbis", "wav", "flac", "isomp4", "mkv", "pcm"] }
# Opus is what browsers (WebM), Discord and Telegram (Ogg) record; symphonia has no decoder
# of its own. Pure Rust, so the binary stays self-contained.
symphonia-adapter-opus-rs = { version = "0.1.1" }
whisper-rs = { version = "0.16.0", features = ["tracing_backend"] }
any-tts = { version = "0.2.0", default-features = false, features = ["kokoro"] }
similar = { version = "3", default-features = false, features = ["text"] }
monty = "=1.0.0"
monty-types = "=1.0.0"
opentelemetry = { version = "0.33" }
opentelemetry_sdk = { version = "0.33" }
tracing-opentelemetry = { version = "0.34" }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-blocking-client"] }
libc = "0.2"
# The workspace's own crates. One version for all four, bumped in this file only.
vizier-derive = { path = "crates/vizier-derive", version = "0.14.0-rc.1" }
vizier-core = { path = "crates/vizier-core", version = "0.14.0-rc.1" }
vizier-http = { path = "crates/vizier-http", version = "0.14.0-rc.1" }

# Dependencies are compiled optimised even in dev builds. Local speech (candle for Kokoro,
# whisper.cpp) is unusably slow at opt-level 0; vizier's own crates stay unoptimised so
# rebuilds remain quick. Build-script and proc-macro code is unaffected.
[profile.dev.package."*"]
opt-level = 3
