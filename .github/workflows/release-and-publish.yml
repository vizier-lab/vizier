name: Release, Build & Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0, 0.3.0-rc.1)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (skip git push, GitHub release, and crates.io publish)'
        required: false
        type: boolean
        default: false
      only:
        description: 'Dry runs only: build one desktop target (macos-universal, linux-amd64, linux-aarch64, windows-x64); empty builds all'
        required: false
        type: string

# Two dispatches used to run side by side: on 2026-10-31 that produced four identical
# "bump version to 0.14.0-rc.3" commits and a tag one run created while another still had it
# checked out. Queue the second dispatch instead of cancelling the first - a release that is
# interrupted half-way is exactly what leaves a stale tag behind.
concurrency:
  group: release-and-publish
  cancel-in-progress: false

jobs:
  # ====================
  # Step 1: Release & Build
  # ====================
  release:
    name: Release & Build
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ inputs.version }}
      dry_run: ${{ inputs.dry_run }}
      only: ${{ inputs.only }}
    secrets: inherit

  # ====================
  # Step 2: Publish to crates.io
  # ====================
  publish:
    name: Publish
    needs: release
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ inputs.version }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit

  # ====================
  # Step 3: Deploy the website
  # ====================
  # This is deliberately not part of cleanup-failure's needs: a landing deploy
  # failure must never delete a published release and tag.
  deploy-landing:
    name: Deploy Landing
    needs: release
    if: ${{ !inputs.dry_run && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check dispatch token
        id: token
        env:
          TOKEN: ${{ secrets.LANDING_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::LANDING_DISPATCH_TOKEN is not set; the website will not be redeployed"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch landing deploy
        if: steps.token.outputs.present == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.LANDING_DISPATCH_TOKEN }}
          repository: vizier-lab/landing
          event-type: vizier-release
          client-payload: '{"version":"${{ inputs.version }}","ref":"v${{ inputs.version }}"}'

  # ====================
  # Step 4: Docker Publish
  # ====================
  docker:
    name: Docker Publish
    needs: release
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  # ====================
  # Summary
  # ====================
  summary:
    name: Summary
    needs: [release, publish, docker, deploy-landing]
    if: ${{ always() && !inputs.dry_run && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create summary
        run: |
          echo "## Release Complete! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### What was done:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Version bumped in Cargo.toml" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Changelog generated" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Git tag created and pushed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Binaries built for all platforms" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ GitHub Release created with assets" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Published to crates.io" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Published Docker image to Docker Hub & GHCR" >> $GITHUB_STEP_SUMMARY
          echo "- Website deploy: ${{ needs.deploy-landing.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Install:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "cargo binstall vizier  # Fast (prebuilt binary)" >> $GITHUB_STEP_SUMMARY
          echo "cargo install vizier   # Build from source" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Links:" >> $GITHUB_STEP_SUMMARY
          echo "- [GitHub Release](https://github.com/${{ github.repository }}/releases/tag/v${{ inputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "- [crates.io](https://crates.io/crates/vizier/${{ inputs.version }})" >> $GITHUB_STEP_SUMMARY

  # ====================
  # Cleanup on failure - delete tag and release
  # ====================
  cleanup-failure:
    name: Cleanup on Failure
    needs: [release, publish]
    runs-on: ubuntu-latest
    # Only a failed *release* is worth undoing. When `publish` is what failed, crates.io already
    # holds some of the four crates and cargo refuses to upload them twice, so the tag is the
    # only way back: publish.yml checks out `ref: v<version>`. Deleting it there made a partial
    # publish unrecoverable.
    if: ${{ always() && !inputs.dry_run && needs.release.result == 'failure' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Delete GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v${{ inputs.version }} --repo ${{ github.repository }} &>/dev/null; then
            echo "Deleting GitHub release v${{ inputs.version }}"
            gh release delete v${{ inputs.version }} --yes
          else
            echo "No GitHub release found to delete"
          fi

      - name: Delete Git Tag
        run: |
          if git tag | grep -q "^v${{ inputs.version }}$"; then
            echo "Deleting git tag v${{ inputs.version }}"
            git tag -d v${{ inputs.version }}
            git push origin :refs/tags/v${{ inputs.version }}
          else
            echo "No git tag found to delete"
          fi

      - name: Report cleanup
        run: |
          echo "## Cleanup Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Release v${{ inputs.version }} failed** - cleaned up git tag and GitHub release." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "You can now retry the release with the same version." >> $GITHUB_STEP_SUMMARY
