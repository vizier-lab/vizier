name: CI

# Per-PR checks (specs/037-core-extraction research R15). `core-*` build the engine alone, with
# no optional features and with all of them; only `vizier-http` embeds the WebUI, so only
# `server` needs it built.

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Every rustc warning and clippy's correctness/suspicious lints fail the build. The style,
  # complexity and perf groups are left as warnings: the tree carried ~100 of them before CI
  # existed, and clearing them is its own change.
  CLIPPY_LINTS: -D warnings -A clippy::style -A clippy::complexity -A clippy::perf

jobs:
  server:
    name: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            design/package-lock.json
            webui/package-lock.json
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev python3-dev libclang-dev clang perl make
      - name: Build WebUI
        run: |
          (cd design && npm ci)
          (cd webui && npm ci && npm run build)
      - name: Clear node_modules so cargo doesn't rebuild the WebUI
        run: rm -rf webui/node_modules
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- $CLIPPY_LINTS
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release -p vizier

  webui:
    name: webui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            design/package-lock.json
            webui/package-lock.json
      - run: (cd design && npm ci)
      - working-directory: webui
        run: |
          npm ci
          npm run typecheck
          npx vitest run

  core:
    name: core-${{ matrix.set }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: minimal
            features: --no-default-features
          - set: full
            features: --all-features
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: core-${{ matrix.set }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev python3-dev libclang-dev clang perl make
      - name: Clippy
        run: cargo clippy -p vizier-core --all-targets ${{ matrix.features }} -- $CLIPPY_LINTS
      - name: Test
        # The dummyplug harness starts the Node server from the `dummyplug` submodule.
        env:
          CI: 'true'
        run: cargo test -p vizier-core ${{ matrix.features }}
      - name: Headless example
        run: cargo build -p vizier-core ${{ matrix.features }} --example headless

  layering:
    name: layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check each crate's direct dependencies
        # The engine must not declare the web framework, the CLI or the terminal UI, and the
        # HTTP adapter must not declare the CLI. Direct dependencies only: a third-party crate
        # may legitimately pull axum or tower-http in transitively (bollard via tonic).
        run: |
          set -euo pipefail
          direct() {
            cargo metadata --format-version 1 --locked \
              | jq -r --arg c "$1" '.packages[] | select(.name==$c) | .dependencies[] | select(.kind==null) | .name'
          }
          fail=0
          check() {
            crate="$1"; shift
            for banned in "$@"; do
              if direct "$crate" | grep -qx "$banned"; then
                echo "::error::$crate depends on $banned, which belongs to a layer above it"
                fail=1
              fi
            done
          }
          check vizier-core axum axum-extra tower-http utoipa-axum utoipa-swagger-ui clap inquire termimad daemonize dotenvy opentelemetry-otlp jsonwebtoken argon2 tracing-subscriber
          check vizier-http clap inquire termimad daemonize dotenvy opentelemetry-otlp
          exit $fail

  deps:
    name: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare resolved dependencies with master
        # FR-019: no dependency version or source may change. The workspace's own crates are
        # left out; an entry on one side only (a feature made optional) is printed, not failed.
        run: |
          set -euo pipefail
          triples() {
            cargo metadata --format-version 1 --locked --manifest-path "$1/Cargo.toml" \
              | jq -r '.packages[] | "\(.name) \(.version) \(.source)"' \
              | grep -vE '^vizier(-core|-http|-derive)? ' | sort -u
          }
          git worktree add ../master origin/master
          triples ../master > /tmp/master.txt
          triples . > /tmp/head.txt
          # A crate name on both sides whose set of (version, source) differs fails; a crate
          # locked at several versions is compared as a set, not line by line.
          python3 -I - /tmp/master.txt /tmp/head.txt <<'PY'
          import sys
          from collections import defaultdict
          def load(path):
              out = defaultdict(set)
              for line in open(path):
                  name, rest = line.rstrip("\n").split(" ", 1)
                  out[name].add(rest)
              return out
          base, head = load(sys.argv[1]), load(sys.argv[2])
          only = sorted(set(base) ^ set(head))
          if only:
              print("::notice::crates present on one side only (review):")
              for n in only:
                  print(f"  {n}: master={sorted(base.get(n, []))} head={sorted(head.get(n, []))}")
          changed = [n for n in sorted(set(base) & set(head)) if base[n] != head[n]]
          if changed:
              print("::error::resolved dependency versions or sources changed:")
              for n in changed:
                  print(f"  {n}: master={sorted(base[n])} head={sorted(head[n])}")
              sys.exit(1)
          print("no dependency version changes")
          PY

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            design/package-lock.json
            webui/package-lock.json
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev python3-dev libclang-dev clang perl make
      - name: Build WebUI
        run: |
          (cd design && npm ci)
          (cd webui && npm ci && npm run build)
          rm -rf webui/node_modules
      - name: Stage WebUI
        run: |
          mkdir -p crates/vizier-http/webui-dist
          cp -r webui/build/client/. crates/vizier-http/webui-dist/
      - name: Package every crate
        # Each crate is built from its own .crate file against a local overlay of the others.
        run: |
          cargo package --workspace --allow-dirty
          for crate in target/package/*.crate; do
            size=$(stat -c %s "$crate")
            echo "$crate: $size bytes"
            [ "$size" -le 10485760 ] || (echo "::error::$crate exceeds crates.io's 10 MB limit"; exit 1)
          done
      - name: Build the docs as docs.rs does
        env:
          DOCS_RS: '1'
        run: cargo doc -p vizier-core --no-deps --features discord,telegram,documents,utoipa
      - name: Public API of vizier-core
        # The stable tier only: #[doc(hidden)] items are not in rustdoc JSON. A change to the API
        # has to update crates/vizier-core/public-api.txt in the same pull request.
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-public-api --locked
          cargo public-api -p vizier-core --simplified > /tmp/public-api.txt
          if [ -f crates/vizier-core/public-api.txt ]; then
            diff -u crates/vizier-core/public-api.txt /tmp/public-api.txt \
              || (echo "::error::vizier-core's public API changed; update crates/vizier-core/public-api.txt"; exit 1)
          else
            echo "::notice::no crates/vizier-core/public-api.txt yet; add this output:"
            cat /tmp/public-api.txt
          fi
      # cargo-semver-checks compares against the last published vizier-core, which does not
      # exist before the first release of these crates: add it to this job after that release.
