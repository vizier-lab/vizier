name: Submodule PRs

# Links a vizier PR to its PRs in the submodule repositories and merges them in
# dependency order (design → webui → vizier), so the gitlinks a PR carries
# always point at commits that are on the submodules' default branches.
#
#   /cascade-merge            merge the linked submodule PRs, bump the gitlinks
#                             in this PR, then merge this PR
#   /cascade-merge --dry-run  say what that would do, without merging anything
#
# The cross-repository work needs a token that can act on vizier-lab/design and
# vizier-lab/webui: set a `SUBMODULE_TOKEN` repository secret (a fine-grained PAT
# or GitHub App token with Contents and Pull requests read/write on both). Without
# it, only the linking check works, with GITHUB_TOKEN.
#
# See "Linking submodule pull requests" in docs/src/getting-started/contributing.md.

on:
  pull_request:
    types: [opened, reopened, edited, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Vizier PR number'
        required: true
        type: string
      command:
        description: 'What to do'
        required: true
        type: choice
        options: [link, cascade]
        default: link
      dry_run:
        description: 'Cascade only: report what would happen, merge nothing'
        required: false
        type: boolean
        default: false

concurrency:
  # Never cancel a cascade halfway: it merges submodule PRs and pushes a commit.
  group: submodule-prs-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

env:
  GH_TOKEN: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}
  GITHUB_REPOSITORY: ${{ github.repository }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  # Keep the sticky comment and the `submodule-prs` commit status up to date.
  links:
    name: Link submodule PRs
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.command == 'link')
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the changed gitlinks are read from the base...head diff.
          fetch-depth: 0
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect and report linked PRs
        run: node scripts/submodule-prs.mjs link --pr "$PR_NUMBER"

  # `/cascade-merge` on a vizier PR: submodules first, then the vizier PR.
  cascade:
    name: Cascade merge
    if: >
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && startsWith(github.event.comment.body, '/cascade-merge')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      || (github.event_name == 'workflow_dispatch' && inputs.command == 'cascade')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the pull request
        id: pr
        env:
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr }}
        run: |
          # This runs before the checkout, so there is no repository to infer
          # from the working directory: name it explicitly, or `gh` fails with
          # "not a git repository" and the outputs stay empty. `pipefail` keeps
          # that failure from being swallowed by the `tee` pipe.
          set -euo pipefail
          gh pr view "$PR_NUMBER" -R "$GITHUB_REPOSITORY" \
            --json headRefName,headRefOid,headRepositoryOwner \
            --jq '"branch=\(.headRefName)\nhead_sha=\(.headRefOid)\nowner=\(.headRepositoryOwner.login // "")"' \
            | tee -a "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Check the branch is in this repository
        env:
          OWNER: ${{ steps.pr.outputs.owner }}
        run: |
          if [ "$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" != "$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::error::The cascade needs a branch in ${{ github.repository }}, not a fork ($OWNER)."
            exit 1
          fi

      - name: Checkout the PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Merge submodules, bump the gitlinks, merge the PR
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          DRY_RUN: ${{ inputs.dry_run || contains(github.event.comment.body, '--dry-run') }}
          CASCADE_MERGE_METHOD: ${{ vars.CASCADE_MERGE_METHOD || 'squash' }}
          CASCADE_DELETE_BRANCH: ${{ vars.CASCADE_DELETE_BRANCH || 'true' }}
          CASCADE_CHECK_TIMEOUT_SECS: ${{ vars.CASCADE_CHECK_TIMEOUT_SECS || '1200' }}
        run: node scripts/submodule-prs.mjs cascade --pr "$PR_NUMBER"

      - name: Report a failure on the PR
        if: failure() && steps.pr.outputs.number != ''
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr comment "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --body "$(cat <<'EOF'
          The submodule cascade failed: ${{ env.RUN_URL }}

          A failure during preflight merges nothing. If it failed after a submodule PR was merged, that merge is not rolled back — fix the cause and comment `/cascade-merge` again; already-merged PRs are skipped and their commits are pinned by the retry.
          EOF
          )"
