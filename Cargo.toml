[workspace]
members = ["vizier-derive"]

[package]
name = "vizier"
version = "0.12.0"
edition = "2024"
authors = ["Ganesha Danu <hi@blinfoldking.dev>"]
description = "21st Century Digital Steward; Right hand agent for you majesty"
license = "MIT"
readme = "Readme.md"
repository = "https://github.com/vizier-lab/vizier"
include = [
  "/src/**/*",
  "/build.rs",
  "/Cargo.toml",
  "/Readme.md",
  "/templates/**/*",
  # Pre-built webui files (run 'npm run build' in webui/ before publishing)
  "/webui/build/client/**/*",
]
keywords = ["ai", "cli", "agent"]

[dependencies]
chrono = { version = "0.4.43", features = ["serde"] }
axum = { version = "0.8.8", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["multipart"] }
anyhow = "1.0.100"
arc-swap = "1.7"
clap = { version = "4.5.57", features = ["derive"] }
config = "0.15.19"
dirs = "7.0.0"
flume = "0.12.0"
form_urlencoded = "1.2.2"
futures = "0.3.31"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.12.3"
reqwest = "0.13.2"
rig-core = { version = "0.38.2", features = ["derive", "rmcp", "audio", "image"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_urlencoded = "0.7.1"
serde_yaml = "0.9.34"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
twilight-gateway = { version = "0.17.1", default-features = false, features = ["rustls-platform-verifier", "twilight-http", "zstd"] }
twilight-http = { version = "0.17.1", default-features = false, features = ["rustls-platform-verifier", "decompression"] }
twilight-model = "0.17.1"
twilight-util = { version = "0.17.0", features = ["builder", "snowflake"] }
teloxide = "0.17"
slugify = "0.1.0"
strum = "0.28.0"
text-splitter = { version = "0.33.0", features = ["markdown"] }
tokio = { version = "1.49.0", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "net",
  "sync",
] }
uuid = { version = "1.21.0", features = ["serde", "v4"] }
duration-string = { version = "0.5.3", features = ["serde"] }
inquire = { version = "0.9.3", features = ["chrono"] }
tokio-tungstenite = "0.30.0"
tungstenite = "0.30.0"
nanoid = "0.5.0"
parking_lot = "0.12"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
argon2 = "0.6"
base64 = "0.23"
sha2 = "0.11"
tower-http = { version = "0.7.1", features = ["cors", "fs", "limit", "normalize-path"] }
rust-embed = "8.11.0"
mime_guess = "2.0.5"
rusqlite = { version = "0.40", features = ["bundled"] }
sqlite-vec = "0.1.9"
fastembed = "7.1.1"
croner = { version = "4.0.1", features = ["serde"] }
indicatif = "0.18.6"
rand = "0.10.0"

dotenvy = "0.15.7"
async-trait = "0.1.89"

termimad = "0.35.5"
utoipa = { version = "6", features = ["chrono"] }
utoipa-axum = "0.3"
utoipa-swagger-ui = { version = "10", features = ["axum"] }
glob = "0.3.3"
tar = "0.4"
bzip2 = "0.6"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
shellexpand = "3.1.2"
bollard = { version = "0.21.1", features = ["buildkit", "chrono"] }
rmcp = { version = "1.3.0", features = [
  "client",
  "macros",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
  "transport-streamable-http-server",
] }
html2md = "0.2.15"
daemonize = "0.5.0"
tempfile = "3"
pdf-extract = "0.12"
docx-rs = "0.4"
calamine = "0.36"
hound = "3.5"
symphonia = { version = "0.6.1", features = ["mp3", "ogg", "vorbis", "wav", "flac", "isomp4", "mkv", "pcm"] }
sherpa-onnx = "1.13"
similar = { version = "3", default-features = false, features = ["text"] }
monty = "=0.0.23"
monty-types = "=0.0.23"
vizier-derive = { path = "vizier-derive", version = "0.12.0" }

[dev-dependencies]
tokio = { version = "1.49.0", features = ["test-util"] }

[features]
default = []

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/vizier-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "vizier-v{ version }-{ target }/{ bin }"
