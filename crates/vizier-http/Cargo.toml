[package]
name = "vizier-http"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The HTTP, WebSocket and embedded WebUI adapter for the vizier engine"
keywords = ["ai", "agent", "http"]
categories = ["web-programming::http-server"]
readme = "README.md"
include = [
  "/src/**/*",
  "/build.rs",
  "/Cargo.toml",
  "/README.md",
  "/assets/integrations/**/*",
  # The built WebUI, staged by the publish workflow (gitignored).
  "/webui-dist/**/*",
]

[dependencies]
vizier-core = { workspace = true, features = ["utoipa"] }
anyhow.workspace = true
axum.workspace = true
axum-extra.workspace = true
base64.workspace = true
chrono.workspace = true
croner.workspace = true
duration-string.workspace = true
flume.workspace = true
futures.workspace = true
jsonwebtoken.workspace = true
mime_guess.workspace = true
parking_lot.workspace = true
rand.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
rust-embed = { workspace = true, features = ["interpolate-folder-path"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
tower-http.workspace = true
tower = { version = "0.5", features = ["util"] }
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
utoipa-swagger-ui.workspace = true
zip.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
